server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store" always;

  location /docs/ { return 404; }
  location /src/ { return 404; }
  location /server/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
